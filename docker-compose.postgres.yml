services:
  postgres:
    image: postgres:16-alpine
    container_name: hrsys-postgres
    environment:
      POSTGRES_DB: hrsys
      POSTGRES_USER: hrsys
      POSTGRES_PASSWORD: hrsys
      TZ: Asia/Shanghai
    ports:
      - "15432:5432"
    volumes:
      - hrsys-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrsys -d hrsys"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  hrsys-postgres-data:
