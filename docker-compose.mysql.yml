services:
  mysql:
    image: mysql:8.4
    container_name: hrsys-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hrsys
      MYSQL_USER: hrsys
      MYSQL_PASSWORD: hrsys
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-connections=200
    volumes:
      - hrsys-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uhrsys -phrsys --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  hrsys-mysql-data:
